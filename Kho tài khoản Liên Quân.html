<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kho tài khoản Liên Quân</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f4f1f8;--card:#fff;--ink:#1c1733;--mute:#6b6585;--line:#ddd7ea;--accent:#5b3fd1;--accent-ink:#fff;--gold:#b8860b;--danger:#c2263d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#1f1a3a;--ink:#f0ecff;--mute:#a49dc4;--line:#322b58;--accent:#9b85ff;--accent-ink:#15112a;--gold:#f0c24b;--danger:#ff7088}}
:root[data-theme="dark"]{--bg:#15112a;--card:#1f1a3a;--ink:#f0ecff;--mute:#a49dc4;--line:#322b58;--accent:#9b85ff;--accent-ink:#15112a;--gold:#f0c24b;--danger:#ff7088}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:920px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:clamp(28px,6vw,44px);font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px;max-width:60ch}
.warn{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--mute);margin-bottom:20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar input{flex:1 1 200px;width:auto}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.danger{color:var(--danger)}
button.small{padding:5px 10px;font-size:13px}
.list{display:grid;gap:12px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.acc header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.acc h2{margin:0;font-size:18px}
.rank{font-size:13px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:2px 10px;white-space:nowrap}
.meta{color:var(--mute);font-size:14px;margin:4px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row .k{width:92px;color:var(--mute);font-size:14px}
.row code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:4px 8px;border-radius:6px;word-break:break-all}
.note{font-size:14px;margin:8px 0 0;white-space:pre-wrap}
.acts{display:flex;gap:6px;margin-top:12px}
.empty{text-align:center;color:var(--mute);padding:40px 16px;border:1px dashed var(--line);border-radius:12px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:20px}
dialog::backdrop{background:rgba(10,6,30,.6)}
dialog h2{margin:0 0 12px}
label{display:block;font-size:14px;font-weight:500;margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dacts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Kho tài khoản Liên Quân</h1>
  <p class="sub">Lưu tên đăng nhập, mật khẩu, rank và ghi chú của từng tài khoản. Dữ liệu nằm trong trình duyệt của bạn.</p>
  <div class="warn">Dữ liệu chỉ lưu trên thiết bị và trình duyệt này, không mã hóa. Hãy bấm Xuất file để sao lưu, và không dùng chung máy công cộng.</div>

  <div class="bar">
    <input id="q" type="search" placeholder="Tìm theo tên, tài khoản, ghi chú..." aria-label="Tìm kiếm">
    <button class="primary" id="add">Thêm tài khoản</button>
    <button id="exp">Xuất file</button>
    <button id="imp">Nhập file</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>

  <div id="list" class="list"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dtitle">Thêm tài khoản</h2>
    <label for="f-name">Tên nhân vật trong game</label>
    <input id="f-name" required>
    <div class="two">
      <div><label for="f-type">Đăng nhập bằng</label>
        <select id="f-type"><option>Facebook</option><option>Garena</option><option>Google</option><option>Apple</option><option>Khác</option></select></div>
      <div><label for="f-rank">Rank</label>
        <select id="f-rank"><option>Chưa rõ</option><option>Đồng</option><option>Bạc</option><option>Vàng</option><option>Bạch Kim</option><option>Kim Cương</option><option>Tinh Anh</option><option>Cao Thủ</option><option>Chiến Tướng</option><option>Thách Đấu</option></select></div>
    </div>
    <label for="f-user">Tài khoản / email / SĐT</label>
    <input id="f-user" autocomplete="off">
    <label for="f-pass">Mật khẩu</label>
    <input id="f-pass" type="text" autocomplete="off">
    <div class="two">
      <div><label for="f-heroes">Số tướng</label><input id="f-heroes" type="number" min="0"></div>
      <div><label for="f-skins">Số trang phục</label><input id="f-skins" type="number" min="0"></div>
    </div>
    <label for="f-note">Ghi chú</label>
    <textarea id="f-note" rows="3"></textarea>
    <div class="dacts">
      <button type="button" id="cancel">Hủy</button>
      <button class="primary" type="submit" id="save">Lưu</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var KEY="lienquan-vault-v1", accounts=[], editId=null, shown={};
  var $=function(id){return document.getElementById(id)};
  function load(){try{var r=localStorage.getItem(KEY);accounts=r?JSON.parse(r):[]}catch(e){accounts=[]}if(!Array.isArray(accounts))accounts=[]}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(accounts))}catch(e){toast("Không lưu được vào trình duyệt, hãy xuất file để sao lưu")}}
  function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},1800)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function render(){
    var q=$("q").value.trim().toLowerCase(), box=$("list");
    var items=accounts.filter(function(a){return !q||[a.name,a.user,a.note,a.type,a.rank].join(" ").toLowerCase().indexOf(q)>-1});
    if(!items.length){box.innerHTML='<div class="empty">'+(accounts.length?"Không có tài khoản nào khớp.":"Chưa có tài khoản nào. Bấm Thêm tài khoản để bắt đầu.")+'</div>';return}
    box.innerHTML=items.map(function(a){
      var pw=shown[a.id]?esc(a.pass):"••••••••";
      var stats=[];if(a.heroes!=="")stats.push(esc(a.heroes)+" tướng");if(a.skins!=="")stats.push(esc(a.skins)+" trang phục");
      return '<article class="acc" data-id="'+a.id+'"><header><h2>'+esc(a.name)+'</h2><span class="rank">'+esc(a.rank)+'</span></header>'+
      '<div class="meta">Đăng nhập bằng '+esc(a.type)+(stats.length?" – "+stats.join(", "):"")+'</div>'+
      '<div class="row"><span class="k">Tài khoản</span><code>'+(esc(a.user)||"(trống)")+'</code><button class="small" data-a="cu">Sao chép</button></div>'+
      '<div class="row"><span class="k">Mật khẩu</span><code>'+pw+'</code><button class="small" data-a="tp">'+(shown[a.id]?"Ẩn":"Hiện")+'</button><button class="small" data-a="cp">Sao chép</button></div>'+
      (a.note?'<p class="note">'+esc(a.note)+'</p>':"")+
      '<div class="acts"><button class="small" data-a="ed">Sửa</button><button class="small danger" data-a="rm">Xóa</button></div></article>'}).join("")}
  function find(id){return accounts.filter(function(a){return a.id===id})[0]}
  function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Đã sao chép")},function(){toast("Không sao chép được")})}else toast("Trình duyệt không hỗ trợ sao chép")}
  function openForm(a){
    editId=a?a.id:null;$("dtitle").textContent=a?"Sửa tài khoản":"Thêm tài khoản";
    $("f-name").value=a?a.name:"";$("f-type").value=a?a.type:"Facebook";$("f-rank").value=a?a.rank:"Chưa rõ";
    $("f-user").value=a?a.user:"";$("f-pass").value=a?a.pass:"";$("f-heroes").value=a?a.heroes:"";$("f-skins").value=a?a.skins:"";$("f-note").value=a?a.note:"";
    $("dlg").showModal();$("f-name").focus()}
  $("add").onclick=function(){openForm(null)};
  $("cancel").onclick=function(){$("dlg").close()};
  $("form").onsubmit=function(e){
    e.preventDefault();
    var d={name:$("f-name").value.trim(),type:$("f-type").value,rank:$("f-rank").value,user:$("f-user").value.trim(),pass:$("f-pass").value,heroes:$("f-heroes").value,skins:$("f-skins").value,note:$("f-note").value.trim()};
    if(!d.name)return;
    if(editId){var a=find(editId);for(var k in d)a[k]=d[k]}else{d.id="a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);accounts.unshift(d)}
    persist();$("dlg").close();render();toast("Đã lưu")};
  $("list").onclick=function(e){
    var b=e.target.closest("button");if(!b)return;
    var id=b.closest(".acc").getAttribute("data-id"),a=find(id),act=b.getAttribute("data-a");
    if(act==="cu")copy(a.user);
    else if(act==="cp")copy(a.pass);
    else if(act==="tp"){shown[id]=!shown[id];render()}
    else if(act==="ed")openForm(a);
    else if(act==="rm"&&confirm("Xóa tài khoản "+a.name+"?")){accounts=accounts.filter(function(x){return x.id!==id});persist();render();toast("Đã xóa")}};
  $("q").oninput=render;
  $("exp").onclick=function(){
    if(!accounts.length){toast("Chưa có dữ liệu để xuất");return}
    var blob=new Blob([JSON.stringify(accounts,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),l=document.createElement("a");
    l.href=u;l.download="lien-quan-accounts.json";document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)};
  $("imp").onclick=function(){$("file").click()};
  $("file").onchange=function(e){
    var f=e.target.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;
      data.forEach(function(x){if(x&&x.name&&!find(x.id)){x.id=x.id||"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);accounts.push(x)}});
      persist();render();toast("Đã nhập file")}catch(err){toast("File không hợp lệ")}};
    r.readAsText(f);e.target.value=""};
  load();render();
})();
</script>
</body>
</html>
